# PlanSeed CI — 每次 push / PR 跑测试与静态检查
# Windows sidecar / PyInstaller：见 sidecar-windows.yml（手动触发）

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (pytest / ruff / mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Pytest
        run: uv run pytest

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy (loose baseline — not --strict)
        run: uv run mypy packages solver backend

  frontend:
    name: Desktop (pnpm build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: RequirementSpec fidelity (shared fixture)
        run: pnpm check:fidelity

      - name: Build (tsc + vite)
        run: pnpm build

      - name: Lint
        run: pnpm lint

  rust:
    name: Tauri (cargo check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Tauri / WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      # tauri.conf.json 要求 bundle.resources 路径存在；真 sidecar 仅 Windows 构建产出
      - name: Stub sidecar resources dir
        run: |
          mkdir -p resources/planseed-backend
          echo "CI stub - real onedir from scripts/build_backend_sidecar.ps1" > resources/planseed-backend/.ci-stub

      - name: cargo check
        run: cargo check --locked

[project]
name = "planseed"
version = "0.1.1"
description = "Local-first generative design tool for single-family houses"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Theopote" }]
keywords = [
    "architecture",
    "floorplan",
    "generative-design",
    "local-first",
    "tauri",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "resvg-py>=0.3.4",
    "pillow>=12.3.0",
    "shapely>=2.0",
]

[project.urls]
Homepage = "https://github.com/Theopote/PlanSeed"
Repository = "https://github.com/Theopote/PlanSeed"
Issues = "https://github.com/Theopote/PlanSeed/issues"


[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "hypothesis>=6.165.2",
    "pytest-cov>=7.1.0",
    "pip-audit>=2.9.0",
]
research = [
    "ortools>=9.11",
]
build = [
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/schema", "packages/persistence", "packages/llm", "packages/settings", "solver", "backend"]

[tool.uv]
default-groups = ["dev"]
# build 组不进 default：仅 sidecar / 打包脚本 `uv sync --group build`

[tool.pytest.ini_options]
testpaths = ["packages/schema/tests", "packages/persistence/tests", "packages/llm/tests", "packages/settings/tests", "solver/tests", "backend/tests"]
pythonpath = ["."]
addopts = "-v -m 'not slow'"
markers = [
    "slow: 大样本统计回归（日常用 pytest -m 'not slow' 跳过；全量验证用 pytest -m slow）",
]

# 静态检查：先宽松落地，避免一次大手术；逐步收紧。
# 顺序（勿跳到 mypy --strict）：
#   1) ruff clean
#   2) mypy 核心包（packages / solver 入口）
#   3) 逐目录收紧并删 disable_error_code
# Phase 7.5-B：按目录恢复 return-value / arg-type / assignment（见 overrides）。
# Pydantic / union / dynamic metrics 多，全仓 strict 过早。
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages", "solver", "backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # 行宽由 formatter / 后续收紧
    "B008",  # FastAPI Depends 常见模式
]

[tool.ruff.lint.per-file-ignores]
"solver/tests/**" = ["E402"]
"packages/schema/tests/**" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
allow_untyped_defs = true
allow_incomplete_defs = true
warn_unused_ignores = false
pretty = true
packages = ["packages", "solver", "backend"]
exclude = ["(?x)(^build/|^dist/)"]
# 全局仍禁用较重项；Round 1–3 目标目录用 enable_error_code 覆盖。
# 禁止立刻 --strict / 一次删光下列列表。
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "operator",
    "var-annotated",
    "union-attr",
    "return-value",
    "misc",
]

# 7.5-B Round 1–3：恢复 return-value / arg-type / assignment
[[tool.mypy.overrides]]
module = [
    "packages.schema",
    "packages.schema.*",
    "solver.geometry",
    "solver.geometry.*",
    "solver.constraints",
    "solver.constraints.*",
    "solver.evaluation",
    "solver.evaluation.*",
    "backend.services",
    "backend.services.*",
    "backend.routes",
    "backend.routes.*",
    "packages.llm",
    "packages.llm.*",
]
enable_error_code = ["return-value", "arg-type", "assignment"]

[[tool.mypy.overrides]]
module = "solver.tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "packages.schema.tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "packages.llm.tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "backend.tests.*"
ignore_errors = true

# Phase 7.5-H：覆盖率报告仅观察；禁止 fail_under / CI 门槛，直至观察 2–3 个版本。
[tool.coverage.run]
source = ["packages", "solver", "backend"]
branch = false
omit = [
    "*/tests/*",
    "solver/tests/*",
    "packages/*/tests/*",
    "backend/tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
# 重点观察（非门槛）：solver/constraints · solver/locks · mutation ·
# backend/services（serialization/report）· packages/persistence
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

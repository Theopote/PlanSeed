[project]
name = "planseed"
version = "0.1.0"
description = "Local-first generative design tool for single-family houses"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/schema", "solver", "backend"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["packages/schema/tests", "solver/tests"]
pythonpath = ["."]
addopts = "-v"
